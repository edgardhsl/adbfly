name: Format integrated Rust
on:
  push:
    branches: ['integration/audit-fixes-20261102']
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'edgardhsl/adbfly'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format Rust sources
        run: cargo fmt --manifest-path src-tauri/Cargo.toml
      - name: Publish formatting only if necessary
        env:
          TARGET_BRANCH: integration/audit-fixes-20261102
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src
          if git diff --cached --quiet; then
            echo 'Rust already formatted'
            exit 0
          fi
          git commit -m "style(rust): format integrated SQLite and ADB code"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
