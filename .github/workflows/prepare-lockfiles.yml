name: Prepare application lockfiles

on:
  push:
    branches:
      - 'hotfix/quality-ci#patch'

permissions:
  contents: write

concurrency:
  group: prepare-adbfly-lockfiles
  cancel-in-progress: false

jobs:
  lock:
    if: github.repository == 'edgardhsl/adbfly'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve and lock frontend lint dependencies
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Generate reproducible Rust application lockfile
        run: cargo generate-lockfile --manifest-path src-tauri/Cargo.toml
      - name: Format existing Rust source for the new quality gate
        run: cargo fmt --manifest-path src-tauri/Cargo.toml
      - name: Commit lockfiles back to the hotfix branch
        env:
          TARGET_BRANCH: 'hotfix/quality-ci#patch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json src-tauri/Cargo.lock src-tauri/src
          if git diff --cached --quiet; then
            echo 'Lockfiles already current.'
            exit 0
          fi
          git commit -m "chore(lock): pin npm and Rust dependencies"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
